name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install numpy (needed by the stt tests)
        run: python -m pip install numpy
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell tests (hooks and /speak against a fake daemon)
        run: bash tests/shell.test.sh
      - name: Migration from the old plugin name
        run: bash tests/migrate.test.sh

  macos:
    # The sync.sh checks need PlistBuddy, which only exists on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install numpy (needed by the stt tests)
        run: python -m pip install numpy
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell tests, including sync.sh and the hotkey helper build
        run: bash tests/shell.test.sh
      - name: Migration from the old plugin name
        run: bash tests/migrate.test.sh
      - name: Hotkey helper tests (Swift)
        run: bash tests/helper/run.sh
